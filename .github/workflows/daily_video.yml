name: Daily Bible Video

on:
  schedule:
    # Primary: 08:15 UTC = 11:15 EAT — renders and goes LIVE before 12:00 EAT.
    # GitHub cron can be delayed by hours on busy days (it happened: 08:15
    # once fired at 14:51 UTC). The 08:45 backup slot below catches those
    # misses — double-firing is safe thanks to the once-per-day guard in
    # agent/main.py (exactly one video per EAT calendar day, ever).
    - cron: "15 8 * * *"
    - cron: "45 8 * * *"
  workflow_dispatch:
    inputs:
      book:
        description: "Book to render (blank = next from state.json)"
        required: false
        default: ""
      chapter:
        description: "Chapter number (blank = next from state.json)"
        required: false
        default: ""
      script_file:
        description: "Optional: path to a fixed script JSON (e.g. examples/john1_script.json)"
        required: false
        default: ""
      no_upload:
        description: "Dry run — render but do not upload to YouTube"
        type: boolean
        default: false
      force:
        description: "Bypass the once-per-day guard (post even if today's video is already live)"
        type: boolean
        default: false

# The job pushes state.json back to the repo after each successful upload.
permissions:
  contents: write

# Never run two generations at once.
concurrency:
  group: daily-video
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Ensure FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -n1

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Preflight — Gemini models available today
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          curl -s -m 30 -H "x-goog-api-key: $GEMINI_API_KEY" \
            "https://generativelanguage.googleapis.com/v1beta/models?pageSize=200" \
            | python3 -c "
          import json, sys
          try:
              d = json.load(sys.stdin)
              names = sorted(m['name'].split('/')[-1] for m in d.get('models', []))
              flash = [n for n in names if 'flash' in n.lower()]
              print('flash models:', ', '.join(flash) or '(none)')
          except Exception as exc:
              print('model listing failed:', exc)
          "

      - name: Generate today's video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4o-mini' }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY || 'public' }}
          VOICE: ${{ vars.VOICE || 'en-US-JennyNeural' }}
          BOOK_OVERRIDE: ${{ github.event.inputs.book }}
          CHAPTER_OVERRIDE: ${{ github.event.inputs.chapter }}
          SCRIPT_FILE: ${{ github.event.inputs.script_file }}
          FORCE_UPLOAD: ${{ (github.event_name == 'workflow_dispatch'
                        && (inputs.force == true || inputs.force == 'true')) && 'true' || '' }}
          DRY_RUN: ${{ (github.event_name == 'workflow_dispatch'
                        && (inputs.no_upload == true || inputs.no_upload == 'true')) && 'true' || '' }}
        run: python -m agent.main

      - name: Save video as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-video-${{ github.run_id }}
          path: |
            output/*.mp4
            output/*_thumb.jpg
            output/metadata.json
            output/last_script.json
            output/qa_report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Persist state (next chapter pointer)
        run: |
          git config user.name "bible-video-agent[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add state.json output/metadata.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No state change to commit."
          else
            git commit -m "chore: advance chapter pointer after run $(date -u +%F)"
            # Another push may have landed after checkout (e.g. comment-state
            # commit or a manual push) — rebase ours on top and retry.
            git pull --rebase origin main
            git push
          fi
